server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: open-deepresearch-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: open-deepresearch
          service: open-deepresearch-backend
          __path__: /var/log/open-deepresearch/backend.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            path: path
            status: status
            trace_id: trace_id
      - labels:
          level:
          logger:
          path:
          status:
          trace_id:
      - output:
          source: message

  - job_name: open-deepresearch-frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: open-deepresearch
          service: open-deepresearch-frontend
          __path__: /var/log/open-deepresearch/frontend.log
