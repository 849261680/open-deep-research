global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: open-deepresearch-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8003
        labels:
          service: open-deepresearch-backend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
